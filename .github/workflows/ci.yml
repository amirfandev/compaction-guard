name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with dev extra
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  core-zero-deps:
    # The package promises a stdlib-only core. This job installs with no
    # extras into a bare interpreter and exercises the primary path, so the
    # promise is checked on every push rather than asserted in prose.
    name: Core installs and runs with zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with no extras
        run: python -m pip install .
      - name: Assert the core declares no dependencies
        run: |
          python - <<'EOF'
          from importlib.metadata import requires

          reqs = requires("compaction-guard") or []
          core = [r for r in reqs if "extra ==" not in r]
          assert not core, f"core must stay dependency-free, found: {core}"
          EOF
      - name: Assert the core imports and runs
        run: |
          python - <<'EOF'
          import compaction_guard as cg

          guard = cg.Guard(
              ["The database orders_prod is production. Read-only queries only."]
          )
          compacted = guard.compact(
              "turn 1: connected to orders_prod. turn 2: ran a long analysis.",
              compactor=lambda _context: "The agent analysed some data.",
          )
          guard.assert_present(compacted)
          report = guard.last_report
          assert report is not None, "compact() must record a report"
          assert report.repaired, "REPAIR is the default policy and must inject"
          print(report.to_json())
          EOF

  evidence:
    # Spec section 9: results.json is regenerated in CI and diffed against
    # the committed copy; a stale committed copy fails the build. All model
    # tiers are installed so every committed tier row is actually recomputed.
    name: Evidence corpus and results are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with model extras
        run: python -m pip install -e ".[embeddings,nli]"
      - name: Regenerate the corpus and confirm it is byte-identical
        run: |
          python evidence/make_corpus.py
          git diff --exit-code -- evidence/corpus.jsonl evidence/corpus.sha256
      - name: Regenerate the judge calibration subset and confirm it
        run: |
          python evidence/judge/agreement.py --write-subset
          git diff --exit-code -- evidence/judge/subset.jsonl
      - name: Recompute results and diff against the committed copy
        run: |
          python evidence/recompute.py
          git diff --exit-code -- evidence/results.json

  extra-embeddings:
    name: Extra embeddings (calibration fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the embeddings extra
        run: python -m pip install -e ".[embeddings,dev]"
      - name: Warm the pinned model cache (network allowed here, not in tests)
        run: |
          python - <<'EOF'
          from compaction_guard.detectors.base import SummaryView
          from compaction_guard.detectors.embedding import EmbeddingDetector
          from compaction_guard.invariant import Invariant

          detector = EmbeddingDetector()
          detector.examine(
              Invariant.parse("The probe budget cap is $1."),
              SummaryView.from_summary("The probe budget cap is $1."),
          )
          assert detector.unavailable is None, detector.unavailable
          EOF
      - name: Pytest (offline; calibration cases must run, not skip)
        run: |
          pytest
          pytest tests/test_calibration.py -q -k embedding -rs | tee out.txt
          ! grep -q "SKIPPED" out.txt

  extra-nli:
    name: Extra nli (calibration fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the nli extra
        run: python -m pip install -e ".[nli,dev]"
      - name: Warm the pinned model cache (network allowed here, not in tests)
        run: |
          python - <<'EOF'
          from compaction_guard.detectors.base import SummaryView
          from compaction_guard.detectors.nli import NLIDetector
          from compaction_guard.invariant import Invariant

          detector = NLIDetector()
          detector.examine(
              Invariant.parse("The probe budget cap is $1."),
              SummaryView.from_summary("The probe budget cap is $1."),
          )
          assert detector.unavailable is None, detector.unavailable
          EOF
      - name: Pytest (offline; calibration cases must run, not skip)
        run: |
          pytest
          pytest tests/test_calibration.py -q -k nli -rs | tee out.txt
          ! grep -q "SKIPPED" out.txt

  extra-langchain:
    name: Extra langchain (real import path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the langchain extra
        run: python -m pip install -e ".[langchain,dev]"
      - name: Real import path
        run: python -c "import compaction_guard.integrations.langchain"
      - name: Pytest (adapter tests run against the installed framework)
        run: pytest tests/test_integrations_langchain.py -v

  extra-openai-agents:
    name: Extra openai-agents (real import path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the openai-agents extra
        run: python -m pip install -e ".[openai-agents,dev]"
      - name: Real import path
        run: python -c "import compaction_guard.integrations.openai_agents"
      - name: Pytest
        run: pytest tests/test_integrations_openai.py -v

  extra-anthropic:
    name: Extra anthropic (real import path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the anthropic extra
        run: python -m pip install -e ".[anthropic,dev]"
      - name: Real import path
        run: python -c "import compaction_guard.integrations.anthropic"
      - name: Pytest
        run: pytest tests/test_integrations_anthropic.py -v
