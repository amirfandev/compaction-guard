name: Release

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication is Trusted Publishing (OIDC), not an API token. PyPI is
# configured to trust this repository running this workflow file in the "pypi"
# environment, and GitHub mints a short-lived identity token for each run. No
# long-lived secret exists anywhere: nothing to leak, nothing to rotate, and
# nothing for a compromised workflow in another repository to reuse.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # A tag that disagrees with the version in pyproject.toml produces a
      # release nobody can reproduce from the tag, so refuse before uploading.
      - name: Check the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, pathlib, sys, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag and version agree: {version}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      # Catches a malformed README before PyPI rejects the upload, which it
      # does after the version number is already burned.
      - name: Check the metadata renders
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/compaction-guard
    permissions:
      id-token: write   # the OIDC token; this is the whole credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
